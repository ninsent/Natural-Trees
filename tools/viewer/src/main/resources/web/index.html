<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natural Trees viewer</title>
<style>
  :root {
    --bg: #f3f3f1;
    --line: #d6d6d2;
    --ink: #24231f;
    --muted: #6d6b64;
    --accent: #2f6f3f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    overflow: hidden;
  }
  #app { display: flex; height: 100%; }

  /* ---------- sidebar ---------- */
  #panel {
    width: 340px;
    min-width: 340px;
    height: 100%;
    overflow-y: auto;
    background: var(--bg);
    border-right: 1px solid var(--line);
    padding: 8px;
  }
  .brand { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .head { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px; }
  .btns { display: flex; gap: 4px; margin: 6px 0; }
  .btns button { flex: 1; }
  button, select, input[type=number], input[type=text] {
    font: inherit; color: inherit;
    background: #fff; border: 1px solid var(--line); border-radius: 3px;
    padding: 2px 4px; min-width: 0;
  }
  button { background: #fafaf8; cursor: pointer; }
  button:hover { background: #ececea; }
  select { width: 100%; }

  .row {
    display: grid;
    grid-template-columns: 104px 1fr 54px;
    gap: 4px; align-items: center;
    margin: 2px 0;
  }
  .row.wide { grid-template-columns: 104px 1fr; }
  .lab { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lab .dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    margin-left: 4px; background: transparent; vertical-align: middle;
  }
  .lab.changed { color: var(--ink); font-weight: 600; }
  .lab.changed .dot { background: #c2591b; }
  input[type=range] { width: 100%; min-width: 0; }
  input[type=number] { width: 100%; text-align: right; }
  input[type=checkbox] { justify-self: start; }

  details { border: 1px solid var(--line); border-radius: 3px; margin: 4px 0; background: #fbfbf9; }
  details > summary {
    cursor: pointer; padding: 4px 6px; font-weight: 600; background: #eeeeea;
    border-radius: 2px; user-select: none;
  }
  details[open] > summary { border-bottom: 1px solid var(--line); }
  .body { padding: 4px 6px 6px; }
  .levelbtns { display: flex; gap: 4px; margin: 4px 0; }
  .levelbtns button { flex: 1; }
  .seedrow { display: grid; grid-template-columns: 104px 1fr 54px; gap: 4px; align-items: center; }
  .seednav { display: flex; gap: 4px; margin: 3px 0 0 108px; }
  .seednav button { flex: 1; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 2px; }

  /* ---------- 3D view ---------- */
  #view { position: relative; flex: 1; min-width: 0; height: 100%; }
  #c { display: block; width: 100%; height: 100%; }
  #err {
    position: absolute; left: 50%; transform: translateX(-50%); top: 8px;
    max-width: 70%; z-index: 5;
    background: #b3261e; color: #fff; padding: 5px 10px; border-radius: 3px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  #stats {
    position: absolute; right: 8px; top: 8px; z-index: 4;
    background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 8px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px; line-height: 1.3; white-space: pre; pointer-events: none;
  }
  #stats:empty { display: none; }
  #legend {
    position: absolute; right: 8px; bottom: 8px; z-index: 4;
    background: rgba(255,255,255,.88); border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 8px; font-size: 11px;
  }
  #legend .sw { display: inline-block; width: 11px; height: 11px; margin-right: 4px; vertical-align: -1px; border: 1px solid #0003; }
  #legend div { margin: 1px 0; }

  /* ---------- modal ---------- */
  #modal {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center;
  }
  #modal .box {
    width: 640px; max-width: 90%; max-height: 80%;
    display: flex; flex-direction: column;
    background: #fff; border-radius: 4px; padding: 10px; gap: 6px;
  }
  #modal h2 { margin: 0; font-size: 13px; }
  #modal textarea {
    flex: 1; min-height: 340px; resize: vertical;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
    border: 1px solid var(--line); border-radius: 3px; padding: 6px;
  }
  #modal .foot { display: flex; gap: 6px; justify-content: flex-end; }
  [hidden] { display: none !important; }
</style>

<div id="app">
  <aside id="panel">
    <div class="head">
      <div class="brand">Natural Trees viewer</div>
      <div class="row wide"><span class="lab">species</span><select id="species"></select></div>
      <div class="btns">
        <button id="btnExport">Export</button>
        <button id="btnImport">Import</button>
        <button id="btnReset">Reset</button>
      </div>
      <div class="row"><span class="lab" title="the generated tree height, inside the range the base_height / height_rand fields allow">height</span>
        <input type="range" id="hRange"><input type="number" id="hNum"></div>
      <div class="seedrow"><span class="lab" title="the 64-bit generator seed; the number field takes any integer">seed</span>
        <input type="range" id="sRange" min="0" max="999" step="1" value="0"><input type="number" id="sNum" step="1" value="0"></div>
      <div class="seednav"><button id="btnPrev">prev</button><button id="btnNext">next</button></div>
      <div class="hint">ArrowLeft / P = previous seed, ArrowRight / N = next seed</div>
      <div class="row wide"><span class="lab">overlay</span>
        <select id="overlay">
          <option value="wood">wood</option>
          <option value="load">load</option>
          <option value="radius">radius</option>
        </select></div>
      <div class="row wide"><span class="lab">show leaves</span><input type="checkbox" id="showLeaves" checked></div>
      <div class="row"><span class="lab">leaf opacity</span>
        <input type="range" id="leafOpacity" min="0.1" max="1" step="0.05" value="1"><input type="number" id="leafOpacityNum" min="0.1" max="1" step="0.05" value="1"></div>
      <div class="row wide"><span class="lab">show tips</span><input type="checkbox" id="showTips"></div>
      <div class="row wide"><span class="lab">grid</span><input type="checkbox" id="gridOn"></div>
      <div class="row wide"><span class="lab">grid size</span>
        <select id="gridSize"><option value="3">3x3</option><option value="4">4x4</option><option value="5">5x5</option></select></div>
    </div>
    <div id="groups"></div>
  </aside>

  <main id="view">
    <canvas id="c"></canvas>
    <div id="err" hidden></div>
    <div id="stats"></div>
    <div id="legend" hidden></div>
    <div id="modal" hidden>
      <div class="box">
        <h2 id="modalTitle">Export</h2>
        <textarea id="modalText" spellcheck="false"></textarea>
        <div class="foot">
          <span id="modalNote" class="hint"></span>
          <button id="modalAction">Copy</button>
          <button id="modalClose">Close</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   1. Field schema — one declarative table drives every control
   ===================================================================== */

/** A numeric / boolean / select field descriptor. */
const f = (key, type, min, max, step, title) => ({ key, type, min, max, step, title });
const bool = (key, title) => ({ key, type: 'bool', title });
const pick = (key, options, title) => ({ key, type: 'select', options, title });

const SHAPES = ['conical', 'spherical', 'hemispherical', 'cylindrical',
  'tapered_cylindrical', 'flame', 'inverse_conical', 'tend_flame'];

const CURVE_FIELDS = [
  f('curve', 'float', -180, 180, 1),
  f('curve_back', 'float', -180, 180, 1),
  f('curve_v', 'float', -90, 180, 1, 'negative = helix mode'),
  f('curve_res', 'int', 1, 8, 1),
];
const SPLIT_FIELDS = [
  f('seg_splits', 'float', 0, 2, 0.05),
  f('split_angle', 'float', 0, 90, 1),
  f('split_angle_v', 'float', 0, 45, 1),
];

const TRUNK_FIELDS = [
  ...CURVE_FIELDS,
  f('base_splits', 'int', 0, 3, 1),
  ...SPLIT_FIELDS,
];

const LEVEL_FIELDS = [
  f('branches', 'int', 0, 32, 1),
  f('length', 'float', 0, 1, 0.01),
  f('length_v', 'float', 0, 1, 0.01),
  f('down_angle', 'float', 0, 180, 1),
  f('down_angle_v', 'float', -90, 90, 1, 'negative = varies along the parent'),
  f('rotate', 'float', -180, 180, 1, 'negative = alternate sides'),
  f('rotate_v', 'float', 0, 180, 1),
  Object.assign(f('tip_radius_offset', 'int', -2, 1, 1), { def: 0 }),
  ...CURVE_FIELDS,
  ...SPLIT_FIELDS,
];

const FOLIAGE_FIELDS = [
  f('foliage_start', 'float', 0, 1, 0.01),
  f('trunk_foliage', 'float', 0, 1, 0.01),
  f('radius_base', 'float', 0.5, 4, 0.05),
  f('radius_tip', 'float', 0.5, 4, 0.05),
  f('radius_v', 'float', 0, 0.5, 0.01),
  f('flatten', 'float', 0.3, 1.5, 0.05),
  f('lift', 'float', -1, 1, 0.05),
  f('density', 'float', 0, 1, 0.01),
  f('smother', 'int', 0, 16, 1),
  f('max_distance', 'int', 1, 6, 1),
  f('max_leaves', 'int', 1, 4096, 1),
];

/** Fixed groups; the "Level n" groups are inserted between Trunk and Foliage. */
const GROUPS = [
  { title: 'Tree', path: ['trunk_placer'], fields: [
    f('base_height', 'int', 0, 32, 1, 'with the height_rand fields this only defines the legal height range'),
    f('height_rand_a', 'int', 0, 24, 1),
    f('height_rand_b', 'int', 0, 24, 1),
    pick('shape', SHAPES),
    f('base_size', 'float', 0, 0.9, 0.01),
    f('attraction_up', 'float', -3, 3, 0.05),
  ] },
  { title: 'Thickness', path: ['trunk_placer'], fields: [
    f('twig_radius', 'float', 0.1, 0.5, 0.01),
    f('pipe_exponent', 'float', 1.5, 3.5, 0.05),
    f('trunk_width_min', 'int', 1, 2, 1, 'must be <= trunk_width_max'),
    f('trunk_width_max', 'int', 1, 2, 1),
    bool('trunk_leader'),
  ] },
  { title: 'Limits', path: ['trunk_placer'], fields: [
    f('max_radius', 'int', 2, 14, 1, 'max_radius + foliage_margin must be <= 16'),
    f('foliage_margin', 'int', 1, 6, 1, 'max_radius + foliage_margin must be <= 16'),
    f('max_tips', 'int', 1, 48, 1),
  ] },
  { title: 'Trunk', path: ['trunk_placer', 'trunk'], fields: TRUNK_FIELDS },
  { title: 'Foliage', path: ['foliage_placer'], fields: FOLIAGE_FIELDS, last: true },
];

const DEFAULT_LEVEL = {
  branches: 3, length: 0.5, length_v: 0.1, down_angle: 45, down_angle_v: 0,
  rotate: 140, rotate_v: 0, curve: 0, curve_back: 0, curve_v: 0, curve_res: 2,
  seg_splits: 0, split_angle: 0, split_angle_v: 0,
};

/** The 12 counters of the binary answer, in order, with readable labels. */
const COUNTERS = [
  ['stems_generated', 'stems generated'],
  ['stems_removed_by_tip_budget', 'cut by tip budget'],
  ['stems_truncated', 'stems truncated'],
  ['stems_dropped_by_face_rule', 'dropped: face rule'],
  ['stems_dropped_with_parent', 'dropped with parent'],
  ['leaf_candidates', 'leaf candidates'],
  ['leaves_discarded_by_shade', 'leaves: shade'],
  ['leaves_discarded_by_reach', 'leaves: reach'],
  ['leaves_discarded_by_budget', 'leaves: budget'],
  ['world_reads', 'world reads'],
  ['stem_cap_reached', 'stem cap reached'],
  ['wide_trunk_blocked_at_base', 'wide trunk blocked'],
];

/* =====================================================================
   2. State
   ===================================================================== */

let cfg = null;        // the edited {trunk_placer, foliage_placer}
let baseCfg = null;    // the species as it was loaded, for the "changed" dots
let heightValue = 1;
let seedText = '0';
let lastTrees = null;  // last successful generation, for redraws without a request

const controls = [];   // built control objects with a sync() method
const openState = new Map([['Tree', true], ['Level 1', true]]);

const $ = (id) => document.getElementById(id);
const clone = (o) => JSON.parse(JSON.stringify(o));

/* =====================================================================
   3. Small helpers
   ===================================================================== */

function valueAt(root, path, field) {
  let o = root;
  for (const k of path) {
    if (o === null || o === undefined) return fallback(field);
    o = o[k];
  }
  return (o === undefined || o === null) ? fallback(field) : o;
}

function fallback(field) {
  if (field.def !== undefined) return field.def;
  if (field.type === 'bool') return false;
  if (field.type === 'select') return field.options[0];
  return field.min;
}

function setAt(root, path, value) {
  let o = root;
  for (let i = 0; i < path.length - 1; i++) o = o[path[i]];
  o[path[path.length - 1]] = value;
}

/** Snaps to the field's step so integers stay integers and floats stay clean. */
function quantize(v, field) {
  if (!Number.isFinite(v)) return fallback(field);
  if (field.type === 'int') return Math.round(v);
  const step = field.step || 0.01;
  return Number((Math.round(v / step) * step).toFixed(6));
}

const clamp = (v, field) => Math.min(field.max, Math.max(field.min, v));

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* =====================================================================
   4. Control building (schema driven)
   ===================================================================== */

function buildPanel() {
  const host = $('groups');
  host.textContent = '';
  controls.length = 0;

  const levels = cfg.trunk_placer.levels;
  for (const group of GROUPS) {
    if (group.last) {
      // level groups + their buttons sit just before the Foliage group
      levels.forEach((_, i) => addGroup(host, `Level ${i + 1}`, ['trunk_placer', 'levels', i], LEVEL_FIELDS));
      host.appendChild(levelButtons());
    }
    addGroup(host, group.title, group.path, group.fields);
  }
}

function levelButtons() {
  const wrap = el('div', 'levelbtns');
  const add = el('button', null, 'add level');
  const rm = el('button', null, 'remove last level');
  add.disabled = cfg.trunk_placer.levels.length >= 3;
  rm.disabled = cfg.trunk_placer.levels.length <= 1;
  add.onclick = () => {
    const levels = cfg.trunk_placer.levels;
    levels.push(clone(levels[levels.length - 1] || DEFAULT_LEVEL));
    buildPanel();
    scheduleGenerate();
  };
  rm.onclick = () => {
    cfg.trunk_placer.levels.pop();
    buildPanel();
    scheduleGenerate();
  };
  wrap.append(add, rm);
  return wrap;
}

function addGroup(host, title, path, fields) {
  const d = el('details');
  d.open = openState.get(title) === true;
  d.addEventListener('toggle', () => openState.set(title, d.open));
  d.appendChild(el('summary', null, title));
  const body = el('div', 'body');
  for (const field of fields) addControl(body, path.concat(field.key), field);
  d.appendChild(body);
  host.appendChild(d);
}

function addControl(host, path, field) {
  const row = el('div', field.type === 'bool' || field.type === 'select' ? 'row wide' : 'row');
  const lab = el('label', 'lab', field.key);
  if (field.title) lab.title = field.title;
  lab.appendChild(el('span', 'dot'));
  row.appendChild(lab);

  let write;
  const commit = (v) => {
    setAt(cfg, path, v);
    paint();
    onParamChange(field);
  };
  const paint = () => {
    const changed = valueAt(cfg, path, field) !== valueAt(baseCfg, path, field);
    lab.classList.toggle('changed', changed);
  };

  if (field.type === 'bool') {
    const cb = el('input');
    cb.type = 'checkbox';
    cb.onchange = () => commit(cb.checked);
    row.appendChild(cb);
    write = (v) => { cb.checked = !!v; };
  } else if (field.type === 'select') {
    const sel = el('select');
    for (const o of field.options) sel.appendChild(el('option', null, o)).value = o;
    sel.onchange = () => commit(sel.value);
    row.appendChild(sel);
    write = (v) => { sel.value = v; };
  } else {
    const rng = el('input');
    const num = el('input');
    rng.type = 'range';
    num.type = 'number';
    for (const i of [rng, num]) { i.min = field.min; i.max = field.max; i.step = field.step; }
    rng.oninput = () => { const v = quantize(+rng.value, field); num.value = v; commit(v); };
    // typing stays free-form; the text is only snapped and clamped on change (blur / enter)
    num.oninput = () => {
      const raw = num.value.trim();
      if (raw === '' || !Number.isFinite(+raw)) return;
      const v = clamp(quantize(+raw, field), field);
      rng.value = v;
      commit(v);
    };
    num.onchange = () => {
      const raw = num.value.trim();
      const v = Number.isFinite(+raw) && raw !== '' ? clamp(quantize(+raw, field), field) : valueAt(cfg, path, field);
      write(v);
      commit(v);
    };
    row.append(rng, num);
    write = (v) => { rng.value = v; num.value = v; };
  }

  const ctl = { sync() { write(valueAt(cfg, path, field)); paint(); } };
  controls.push(ctl);
  ctl.sync();
  host.appendChild(row);
}

/** Called after any schema control changes. */
function onParamChange(field) {
  if (['base_height', 'height_rand_a', 'height_rand_b'].includes(field.key)) updateHeightRange(false);
  scheduleGenerate();
}

/* =====================================================================
   5. Height and seed controls
   ===================================================================== */

function heightBounds() {
  const t = cfg.trunk_placer;
  const lo = Math.max(1, t.base_height | 0);
  const hi = Math.max(lo, (t.base_height | 0) + (t.height_rand_a | 0) + (t.height_rand_b | 0));
  return [lo, hi];
}

/** Recomputes the height slider range; with reset=true it also takes the default value. */
function updateHeightRange(reset) {
  const [lo, hi] = heightBounds();
  for (const i of [$('hRange'), $('hNum')]) { i.min = lo; i.max = hi; i.step = 1; }
  if (reset) {
    const t = cfg.trunk_placer;
    heightValue = (t.base_height | 0) + Math.floor((t.height_rand_a | 0) / 2);
  }
  heightValue = Math.min(hi, Math.max(lo, Math.round(heightValue)));
  $('hRange').value = heightValue;
  $('hNum').value = heightValue;
}

function setSeed(text) {
  seedText = text;
  if ($('sNum').value !== text) $('sNum').value = text;
  let n;
  try { n = Number(BigInt(text)); } catch (e) { n = NaN; }
  if (Number.isFinite(n) && n >= 0 && n <= 999) $('sRange').value = n;
  scheduleGenerate();
}

function stepSeed(delta) {
  let v;
  try { v = BigInt(seedText); } catch (e) { v = 0n; }
  setSeed(String(v + BigInt(delta)));
}

/* =====================================================================
   6. Server talk: generate on every change, drop stale answers
   ===================================================================== */

let frameQueued = false;
let requestId = 0;

function scheduleGenerate() {
  if (frameQueued) return;
  frameQueued = true;
  requestAnimationFrame(() => { frameQueued = false; generate(); });
}

function bodiesForRequest() {
  const n = gridOn() ? gridSize() * gridSize() : 1;
  let base;
  try { base = BigInt(seedText); } catch (e) { base = 0n; }
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push({
      trunk_placer: cfg.trunk_placer,
      foliage_placer: cfg.foliage_placer,
      height: Math.round(heightValue),
      seed: String(base + BigInt(i)),
    });
  }
  return out;
}

async function postGenerate(body) {
  let res;
  try {
    res = await fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
  } catch (e) {
    throw new Error('viewer server not reachable');
  }
  if (!res.ok) {
    const text = (await res.text()).trim();
    throw new Error(text || ('server error ' + res.status));
  }
  return parseTree(await res.arrayBuffer());
}

async function generate() {
  if (!cfg) return;
  const id = ++requestId;
  try {
    const trees = await Promise.all(bodiesForRequest().map(postGenerate));
    if (id !== requestId) return; // a newer request won
    showError(null);
    draw(trees);
    showStats(trees);
  } catch (e) {
    if (id !== requestId) return;
    showError(e.message); // the last good tree stays on screen
  }
}

function showError(message) {
  const bar = $('err');
  bar.hidden = !message;
  bar.textContent = message || '';
}

/* =====================================================================
   7. Binary answer parsing
   ===================================================================== */

const MAGIC = 0x3156544E; // "NTV1"
const HEADER_BYTES = 4 * (4 + 12);

function parseTree(buffer) {
  const dv = new DataView(buffer);
  if (buffer.byteLength < HEADER_BYTES || dv.getInt32(0, true) !== MAGIC) {
    throw new Error('unexpected answer from the viewer server');
  }
  const woodCount = dv.getInt32(4, true);
  const leafCount = dv.getInt32(8, true);
  const tipCount = dv.getInt32(12, true);
  const counters = {};
  COUNTERS.forEach(([key], i) => { counters[key] = dv.getInt32(16 + i * 4, true); });

  const woodOff = HEADER_BYTES;
  const leafOff = woodOff + woodCount * 12;
  const tipOff = leafOff + leafCount * 8;
  const wood = new Int16Array(buffer, woodOff, woodCount * 6);
  const leaf = new Int16Array(buffer, leafOff, leafCount * 4);
  const tip = new Int16Array(buffer, tipOff, tipCount * 4);

  // counts we need up front to size the instanced meshes
  let logCount = 0, branchCount = 0, armCount = 0;
  for (let i = 0; i < woodCount; i++) {
    if (wood[i * 6 + 3] === 3) {
      branchCount++;
      let arms = wood[i * 6 + 4];
      while (arms) { armCount += arms & 1; arms >>= 1; }
    } else {
      logCount++;
    }
  }
  return { wood, leaf, tip, woodCount, leafCount, tipCount, counters, logCount, branchCount, armCount };
}

/* =====================================================================
   8. Three.js scene
   ===================================================================== */

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd8ee);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 2000);
camera.position.set(22, 18, 22);

const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xdcecff, 0x585040, 1.15));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(30, 50, 20);
scene.add(sun);

const treeRoot = new THREE.Group();
const groundRoot = new THREE.Group();
scene.add(treeRoot, groundRoot);

/** A unit cube whose two faces along +/-Y are a little lighter (log end grain). */
function makeLogGeometry() {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const colors = new Float32Array(24 * 3).fill(1);
  for (let v = 8; v < 16; v++) { // BoxGeometry face order: +x -x +y -y +z -z
    colors[v * 3] = colors[v * 3 + 1] = colors[v * 3 + 2] = 1.3;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  return geo;
}

// geometries and materials live for the whole session; only the instanced meshes churn
const GEO = {
  log: makeLogGeometry(),
  core: new THREE.BoxGeometry(0.5, 0.5, 0.5),
  arm: new THREE.BoxGeometry(0.5, 0.25, 0.5),
  leaf: new THREE.BoxGeometry(1, 1, 1),
  tip: new THREE.BoxGeometry(0.3, 0.3, 0.3),
};
const MAT = {
  log: new THREE.MeshLambertMaterial({ vertexColors: true }),
  branch: new THREE.MeshLambertMaterial(),
  leaf: new THREE.MeshLambertMaterial(),
  tip: new THREE.MeshLambertMaterial({ color: 0xdd2222 }),
};

const COLOR_LOG = new THREE.Color(0x6b4a2b);
const COLOR_BRANCH = new THREE.Color(0x9a7044);
const COLOR_LEAF = new THREE.Color(0x3f8f3a);
const LOAD_LOW = new THREE.Color(0xffe9a0);
const LOAD_HIGH = new THREE.Color(0x8b1a1a);
const RADIUS_BANDS = [new THREE.Color(0x3f9a3f), new THREE.Color(0xe08a1e), new THREE.Color(0xcc2222)];

const pool = {};   // name -> {mesh, cap}
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

/** Gets an instanced mesh of at least `need` instances, growing the pool when needed. */
function getMesh(name, geometry, material, need) {
  let entry = pool[name];
  if (need === 0) {
    if (entry) entry.mesh.visible = false;
    return null;
  }
  if (!entry || entry.cap < need) {
    if (entry) { treeRoot.remove(entry.mesh); entry.mesh.dispose(); }
    const cap = Math.max(32, Math.ceil(need * 1.3));
    const mesh = new THREE.InstancedMesh(geometry, material, cap);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    mesh.frustumCulled = false;
    treeRoot.add(mesh);
    entry = pool[name] = { mesh, cap };
  }
  entry.mesh.count = need;
  entry.mesh.visible = true;
  return entry.mesh;
}

/* ---------- colours ---------- */

function woodColour(kind, load) {
  const mode = $('overlay').value;
  if (mode === 'load') {
    const t = Math.min(1, Math.log(Math.max(1, load)) / Math.log(16));
    return tmpColor.copy(LOAD_LOW).lerp(LOAD_HIGH, t);
  }
  if (mode === 'radius') {
    const r = (+cfg.trunk_placer.twig_radius) * Math.pow(Math.max(1, load), 1 / (+cfg.trunk_placer.pipe_exponent));
    return tmpColor.copy(r >= 1 ? RADIUS_BANDS[2] : r >= 0.5 ? RADIUS_BANDS[1] : RADIUS_BANDS[0]);
  }
  return tmpColor.copy(kind === 3 ? COLOR_BRANCH : COLOR_LOG);
}

function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function updateLegend() {
  const mode = $('overlay').value;
  const box = $('legend');
  if (mode === 'wood') { box.hidden = true; return; }
  const sw = (c, text) => `<div><span class="sw" style="background:${c}"></span>${text}</div>`;
  box.hidden = false;
  box.innerHTML = mode === 'load'
    ? '<b>load</b>' + sw('#ffe9a0', '1') + sw('#d98a55', '4') + sw('#8b1a1a', '16+')
    : '<b>branch radius</b>' + sw('#3f9a3f', '&lt; 0.5') + sw('#e08a1e', '0.5 – 1.0') + sw('#cc2222', '&ge; 1.0');
}

/* ---------- ground ---------- */

let groundKey = '';
function ensureGround(positions) {
  const key = positions.map((p) => p.x + ':' + p.z).join('|');
  if (key === groundKey) return;
  groundKey = key;
  for (const child of groundRoot.children.slice()) {
    groundRoot.remove(child);
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
  }
  for (const p of positions) {
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(33, 33),
      new THREE.MeshLambertMaterial({ color: 0x8aa06a })
    );
    plane.rotation.x = -Math.PI / 2;
    plane.position.set(p.x + 0.5, -0.02, p.z + 0.5);
    const grid = new THREE.GridHelper(33, 33, 0x54603f, 0x6b7a52);
    grid.position.set(p.x + 0.5, 0.01, p.z + 0.5);
    groundRoot.add(plane, grid);
  }
}

/* ---------- layout ---------- */

const gridOn = () => $('gridOn').checked;
const gridSize = () => +$('gridSize').value;

function layout(count) {
  if (count <= 1) return [{ x: 0, z: 0 }];
  const cols = gridSize();
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push({
      x: ((i % cols) - (cols - 1) / 2) * 36,
      z: (Math.floor(i / cols) - (cols - 1) / 2) * 36,
    });
  }
  return out;
}

/* ---------- drawing ---------- */

function draw(trees) {
  lastTrees = trees;
  const positions = layout(trees.length);
  ensureGround(positions);

  let logs = 0, cores = 0, arms = 0, leaves = 0, tips = 0;
  for (const t of trees) {
    logs += t.logCount; cores += t.branchCount; arms += t.armCount;
    leaves += t.leafCount; tips += t.tipCount;
  }
  const logMesh = getMesh('log', GEO.log, MAT.log, logs);
  const coreMesh = getMesh('core', GEO.core, MAT.branch, cores);
  const armMesh = getMesh('arm', GEO.arm, MAT.branch, arms);
  const leafMesh = getMesh('leaf', GEO.leaf, MAT.leaf, leaves);
  const tipMesh = getMesh('tip', GEO.tip, MAT.tip, tips);

  let li = 0, ci = 0, ai = 0, fi = 0, ti = 0;
  trees.forEach((t, index) => {
    const ox = positions[index].x, oz = positions[index].z;

    for (let i = 0; i < t.woodCount; i++) {
      const x = t.wood[i * 6] + ox + 0.5;
      const y = t.wood[i * 6 + 1] + 0.5;
      const z = t.wood[i * 6 + 2] + oz + 0.5;
      const kind = t.wood[i * 6 + 3];
      const armBits = t.wood[i * 6 + 4];
      const load = t.wood[i * 6 + 5];
      const colour = woodColour(kind, load);

      if (kind !== 3) {
        // the cube's lighter faces point along the log axis
        dummy.position.set(x, y, z);
        dummy.rotation.set(kind === 2 ? Math.PI / 2 : 0, 0, kind === 0 ? Math.PI / 2 : 0);
        dummy.updateMatrix();
        logMesh.setMatrixAt(li, dummy.matrix);
        logMesh.setColorAt(li, colour);
        li++;
        continue;
      }
      dummy.rotation.set(0, 0, 0);
      dummy.position.set(x, y, z);
      dummy.updateMatrix();
      coreMesh.setMatrixAt(ci, dummy.matrix);
      coreMesh.setColorAt(ci, colour);
      ci++;
      // one arm box per set bit: 0.5 x 0.5 thick, 0.25 long, between the core and the face
      for (let bit = 0; bit < 6; bit++) {
        if (!(armBits & (1 << bit))) continue;
        dummy.position.set(x, y, z);
        dummy.rotation.set(0, 0, 0);
        if (bit === 0) dummy.position.y -= 0.375;
        else if (bit === 1) dummy.position.y += 0.375;
        else if (bit === 2) { dummy.position.z -= 0.375; dummy.rotation.x = Math.PI / 2; }
        else if (bit === 3) { dummy.position.z += 0.375; dummy.rotation.x = Math.PI / 2; }
        else if (bit === 4) { dummy.position.x -= 0.375; dummy.rotation.z = Math.PI / 2; }
        else { dummy.position.x += 0.375; dummy.rotation.z = Math.PI / 2; }
        dummy.updateMatrix();
        armMesh.setMatrixAt(ai, dummy.matrix);
        armMesh.setColorAt(ai, colour);
        ai++;
      }
    }

    for (let i = 0; i < t.leafCount; i++) {
      const bx = t.leaf[i * 4], by = t.leaf[i * 4 + 1], bz = t.leaf[i * 4 + 2];
      dummy.position.set(bx + ox + 0.5, by + 0.5, bz + oz + 0.5);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      leafMesh.setMatrixAt(fi, dummy.matrix);
      const n = hash3(bx, by, bz);
      leafMesh.setColorAt(fi, tmpColor.copy(COLOR_LEAF).offsetHSL((n - 0.5) * 0.05, (n - 0.5) * 0.25, (n - 0.5) * 0.16));
      fi++;
    }

    for (let i = 0; i < t.tipCount; i++) {
      dummy.position.set(t.tip[i * 4] + ox + 0.5, t.tip[i * 4 + 1] + 0.5, t.tip[i * 4 + 2] + oz + 0.5);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      tipMesh.setMatrixAt(ti, dummy.matrix);
      ti++;
    }
  });

  for (const mesh of [logMesh, coreMesh, armMesh, leafMesh, tipMesh]) {
    if (!mesh) continue;
    mesh.instanceMatrix.needsUpdate = true;
    if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  }
  if (leafMesh) leafMesh.visible = $('showLeaves').checked;
  if (tipMesh) tipMesh.visible = $('showTips').checked;
  applyLeafOpacity();
}

function applyLeafOpacity() {
  const v = +$('leafOpacity').value;
  MAT.leaf.opacity = v;
  MAT.leaf.transparent = v < 1;
  MAT.leaf.needsUpdate = true;
}

/** Puts the camera where the whole layout is visible. */
function frameCamera() {
  const positions = layout(lastTrees ? lastTrees.length : 1);
  let height = 12;
  if (lastTrees) {
    for (const t of lastTrees) {
      for (let i = 0; i < t.woodCount; i++) height = Math.max(height, t.wood[i * 6 + 1] + 1);
    }
  }
  const spread = positions.length > 1 ? (gridSize() - 1) * 36 + 33 : 33;
  const target = new THREE.Vector3(0.5, height / 2, 0.5);
  const distance = Math.max(spread * 0.9, height * 1.8) + 8;
  camera.position.set(target.x + distance * 0.62, target.y + distance * 0.45, target.z + distance * 0.62);
  orbit.target.copy(target);
  orbit.update();
}

function resize() {
  const w = $('view').clientWidth, h = $('view').clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

(function animate() {
  requestAnimationFrame(animate);
  orbit.update();
  renderer.render(scene, camera);
})();

/* =====================================================================
   9. Stats
   ===================================================================== */

function treeStats(t) {
  let logs = 0, branches = 0, maxY = -1, crown = 0;
  const ground = new Set();
  for (let i = 0; i < t.woodCount; i++) {
    const x = t.wood[i * 6], y = t.wood[i * 6 + 1], z = t.wood[i * 6 + 2];
    if (t.wood[i * 6 + 3] === 3) branches++; else logs++;
    if (y > maxY) maxY = y;
    crown = Math.max(crown, Math.hypot(x, z));
    if (y === 0) ground.add(x + ',' + z);
  }
  for (let i = 0; i < t.leafCount; i++) {
    crown = Math.max(crown, Math.hypot(t.leaf[i * 4], t.leaf[i * 4 + 2]));
  }
  const wide = ground.has('1,0') && ground.has('0,1') && ground.has('1,1');
  return {
    height: maxY + 1, wood: t.woodCount, logs, branches,
    tips: t.tipCount, leaves: t.leafCount, crown,
    trunkWidth: wide ? 2 : 1, counters: t.counters,
  };
}

function showStats(trees) {
  const all = trees.map(treeStats);
  const lines = [];
  const pad = (label, value) => lines.push(label.padEnd(21) + String(value));
  const avg = (get) => all.reduce((s, x) => s + get(x), 0) / all.length;
  const range = (get) => {
    const lo = Math.min(...all.map(get)), hi = Math.max(...all.map(get));
    return lo === hi ? String(lo) : lo + '–' + hi;
  };

  if (all.length === 1) {
    const s = all[0];
    pad('height', s.height);
    pad('wood voxels', s.wood);
    pad('  logs / branches', s.logs + ' / ' + s.branches);
    pad('tips', s.tips);
    pad('leaves', s.leaves);
    pad('crown radius', s.crown.toFixed(1));
    pad('trunk width', s.trunkWidth);
    lines.push('');
    for (const [key, label] of COUNTERS) pad(label, s.counters[key]);
  } else {
    lines.push('grid of ' + all.length + ' trees (averages)');
    pad('height', avg((s) => s.height).toFixed(1));
    pad('wood voxels', avg((s) => s.wood).toFixed(1) + '  [' + range((s) => s.wood) + ']');
    pad('  logs / branches', avg((s) => s.logs).toFixed(1) + ' / ' + avg((s) => s.branches).toFixed(1));
    pad('tips', avg((s) => s.tips).toFixed(1) + '  [' + range((s) => s.tips) + ']');
    pad('leaves', avg((s) => s.leaves).toFixed(1) + '  [' + range((s) => s.leaves) + ']');
    pad('crown radius', avg((s) => s.crown).toFixed(1));
    pad('trunk width', avg((s) => s.trunkWidth).toFixed(1));
    lines.push('');
    for (const [key, label] of COUNTERS) pad(label, avg((s) => s.counters[key]).toFixed(1));
  }
  $('stats').textContent = lines.join('\n');
}

/* =====================================================================
   10. Species, import and export
   ===================================================================== */

async function loadSpeciesList() {
  const res = await fetch('/species/index.json');
  const names = await res.json();
  const sel = $('species');
  sel.textContent = '';
  for (const name of names) sel.appendChild(el('option', null, name)).value = name;
  return names;
}

async function loadSpecies(name) {
  try {
    const res = await fetch('/species/' + encodeURIComponent(name) + '.json');
    if (!res.ok) throw new Error('no such species: ' + name);
    const doc = await res.json();
    applyDocument(doc, true);
    showError(null);
  } catch (e) {
    showError(e instanceof TypeError ? 'viewer server not reachable' : e.message);
  }
}

/** Takes a {trunk_placer, foliage_placer} document (or a configured feature) into the editor. */
function applyDocument(doc, asBaseline) {
  const source = (doc && doc.trunk_placer) ? doc
    : (doc && doc.config && doc.config.trunk_placer) ? doc.config : null;
  if (!source) throw new Error('no trunk_placer found in that JSON');

  cfg = { trunk_placer: clone(source.trunk_placer), foliage_placer: clone(source.foliage_placer || {}) };
  const t = cfg.trunk_placer;
  if (!Array.isArray(t.levels) || t.levels.length === 0) t.levels = [clone(DEFAULT_LEVEL)];
  if (t.levels.length > 3) t.levels.length = 3;
  if (asBaseline) baseCfg = clone(cfg);

  buildPanel();
  updateHeightRange(true);
  lastTrees = null;
  groundKey = '';
  generate().then(frameCamera);
}

function openModal(title, text, actionLabel, onAction, readOnly) {
  $('modalTitle').textContent = title;
  $('modalText').value = text;
  $('modalText').readOnly = !!readOnly;
  $('modalAction').textContent = actionLabel;
  $('modalAction').onclick = onAction;
  $('modalNote').textContent = '';
  $('modal').hidden = false;
}

function copyExport() {
  const area = $('modalText');
  const done = () => { $('modalNote').textContent = 'copied'; };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(area.value).then(done, fallbackCopy);
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    area.readOnly = false;
    area.select();
    try { document.execCommand('copy'); done(); } catch (e) { $('modalNote').textContent = 'copy failed'; }
    area.readOnly = true;
  }
}

/* =====================================================================
   11. Wiring
   ===================================================================== */

$('species').onchange = (e) => loadSpecies(e.target.value);
$('btnReset').onclick = () => loadSpecies($('species').value);

$('btnExport').onclick = () => {
  const text = JSON.stringify({ trunk_placer: cfg.trunk_placer, foliage_placer: cfg.foliage_placer }, null, 2);
  openModal('Export', text, 'Copy', copyExport, true);
};

$('btnImport').onclick = () => {
  openModal('Import', '', 'Apply', () => {
    try {
      applyDocument(JSON.parse($('modalText').value), false);
      $('modal').hidden = true;
    } catch (e) {
      $('modalNote').textContent = e.message;
    }
  }, false);
};
$('modalClose').onclick = () => { $('modal').hidden = true; };

$('hRange').oninput = () => { heightValue = +$('hRange').value; $('hNum').value = heightValue; scheduleGenerate(); };
$('hNum').oninput = () => {
  const [lo, hi] = heightBounds();
  const v = Math.round(+$('hNum').value);
  if (!Number.isFinite(v)) return;
  heightValue = Math.min(hi, Math.max(lo, v));
  $('hRange').value = heightValue;
  scheduleGenerate();
};
$('hNum').onchange = () => { $('hNum').value = heightValue; };

$('sRange').oninput = () => setSeed($('sRange').value);
$('sNum').oninput = () => { if (/^-?\d+$/.test($('sNum').value)) setSeed($('sNum').value); };
$('btnPrev').onclick = () => stepSeed(-1);
$('btnNext').onclick = () => stepSeed(1);

document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') stepSeed(1);
  else if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') stepSeed(-1);
});

$('overlay').onchange = () => { updateLegend(); if (lastTrees) draw(lastTrees); };
$('showLeaves').onchange = () => { if (pool.leaf) pool.leaf.mesh.visible = $('showLeaves').checked && pool.leaf.mesh.count > 0; };
$('showTips').onchange = () => { if (pool.tip) pool.tip.mesh.visible = $('showTips').checked && pool.tip.mesh.count > 0; };
$('leafOpacity').oninput = () => { $('leafOpacityNum').value = $('leafOpacity').value; applyLeafOpacity(); };
$('leafOpacityNum').oninput = () => {
  const v = Math.min(1, Math.max(0.1, +$('leafOpacityNum').value));
  if (!Number.isFinite(v)) return;
  $('leafOpacity').value = v;
  applyLeafOpacity();
};
$('gridOn').onchange = () => generate().then(frameCamera);
$('gridSize').onchange = () => { if (gridOn()) generate().then(frameCamera); };

/* ---------- start ---------- */

resize();
updateLegend();
(async function start() {
  try {
    const names = await loadSpeciesList();
    if (names.length) {
      $('species').value = names[0];
      await loadSpecies(names[0]);
    }
  } catch (e) {
    showError('viewer server not reachable');
  }
})();
</script>
</body>
