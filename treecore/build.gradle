// The generator (spec section 7). Pure Java: no Minecraft, no dependencies. JUnit 5 for tests only.
plugins {
    id 'java-library'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
}

// JMH benchmarks live in their own source set, so that nothing of JMH reaches the library or the mod jars.
sourceSets {
    jmh {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    jmhImplementation 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'naturaltrees.printGolden', System.getProperty('naturaltrees.printGolden', 'false')
}

// Test helper: draws generated trees to PNG files in build/tree-dumps.
// ./gradlew :treecore:dumpTrees -Pspecies=oak -Pseeds=8 -Pheight=9
tasks.register('dumpTrees', JavaExec) {
    group = 'verification'
    description = 'Draws generated trees to PNG files, for inspecting the generator without the game.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kz.nursultan.naturaltrees.treecore.TreeDump'
    systemProperty 'java.awt.headless', 'true'
    args = [project.findProperty('species') ?: 'oak', project.findProperty('seeds') ?: '6',
            project.findProperty('height') ?: '9', layout.buildDirectory.dir('tree-dumps').get().asFile.path]
}

// The loader projects compile these sources into their own jars, exactly as they do with ':common',
// so that players install one file (see multiloader-loader.gradle).
configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
}

// Spec section 15: ./gradlew :treecore:jmh   (add -Pjmh.args='...' to pass JMH options)
tasks.register('jmh', JavaExec) {
    group = 'verification'
    description = 'Runs the JMH benchmarks of the generator with the GC profiler.'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    args = (project.findProperty('jmh.args') ?: '-prof gc').toString().split(' ').toList()
}
